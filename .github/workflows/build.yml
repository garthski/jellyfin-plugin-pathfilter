name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish Jellyfin.Plugin.PathFilter/Jellyfin.Plugin.PathFilter.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p PathFilter_1.0.0.0
          cp out/Jellyfin.Plugin.PathFilter.dll PathFilter_1.0.0.0/
          cp meta.json PathFilter_1.0.0.0/

      - uses: actions/upload-artifact@v4
        with:
          name: PathFilter_1.0.0.0
          path: PathFilter_1.0.0.0/
